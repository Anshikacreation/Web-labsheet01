<!DOCTYPE html>
<html>

<head>
    <title>Expanding Search Box</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 50px;
        }
        
        .search {
            width: 200px;
            padding: 12px;
            border: 2px solid #2563eb;
            border-radius: 25px;
            outline: none;
            transition: width 0.5s ease;
        }
        
        .search:focus {
            width: 400px;
        }
    </style>
</head>

<body>

    <h2>Search</h2>

    <input type="search" class="search" placeholder="Search here...">

</body>

</html>
