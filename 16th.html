<!DOCTYPE html>
<html>

<head>
    <title>Employee Evaluation</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 30px;
        }
        
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
        }
        
        .field {
            margin-bottom: 20px;
        }
        
        .left {
            float: left;
            width: 48%;
        }
        
        .right {
            float: right;
            width: 48%;
        }
        
        .clear {
            clear: both;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        
        textarea {
            height: 100px;
        }
        
        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Employee Evaluation Form</h2>

        <form>

            <div class="field left">
                <label>Employee Name</label>
                <input type="text">
            </div>

            <div class="field right">
                <label>Employee ID</label>
                <input type="text">
            </div>

            <div class="clear"></div>

            <div class="field left">
                <label>Department</label>
                <input type="text">
            </div>

            <div class="field right">
                <label>Rating</label>
                <select>
                <option>Excellent</option>
                <option>Good</option>
                <option>Average</option>
                <option>Poor</option>
            </select>
            </div>

            <div class="clear"></div>

            <div class="field">
                <label>Comments</label>
                <textarea></textarea>
            </div>

            <button type="submit">Submit Evaluation</button>

        </form>

    </div>

</body>

</html>
