<!DOCTYPE html>
<html>

<head>
    <title>Accessible Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            padding: 40px;
        }
        
        form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        
        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }
        
        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <form>

        <h2>Accessible Registration Form</h2>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="course">Course</label>
        <select id="course" name="course">
        <option>MCA</option>
        <option>BCA</option>
        <option>BSc Computer Science</option>
    </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message">
    </textarea>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
