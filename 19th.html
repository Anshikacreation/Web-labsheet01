<!DOCTYPE html>
<html>

<head>
    <title>Typography Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
        }
        
        label {
            font-family: Georgia, serif;
            font-size: 17px;
            line-height: 1.6;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: block;
            margin-top: 15px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
        }
        
        input::placeholder {
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: capitalize;
            line-height: 1.5;
        }
        
        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Registration Form</h2>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">

            <button type="submit">Register</button>

        </form>

    </div>

</body>

</html>
