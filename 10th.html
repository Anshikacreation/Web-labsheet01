<!DOCTYPE html>
<html>

<head>
    <title>Data Entry Table</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            padding: 30px;
        }
        
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th,
        td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }
        
        th {
            background: #2563eb;
            color: white;
        }
        
        tr:nth-child(even) {
            background: #f1f5f9;
        }
        
        tr:hover {
            background: #dbeafe;
        }
        
        input {
            width: 95%;
            padding: 8px;
        }
        
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Data Entry</h2>

        <form>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                </tr>

                <tr>
                    <td><input type="text"></td>
                    <td><input type="email"></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><input type="text"></td>
                    <td><input type="email"></td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td><input type="text"></td>
                    <td><input type="email"></td>
                    <td><input type="text"></td>
                </tr>
            </table>

            <button type="submit">Save Data</button>

        </form>

    </div>

</body>

</html>
