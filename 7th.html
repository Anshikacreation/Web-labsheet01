<!DOCTYPE html>
<html>

<head>
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 40px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        
        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        
        input:focus,
        textarea:focus {
            border-color: #2563eb;
            background-color: #eff6ff;
        }
        
        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Feedback Form</h2>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Feedback</label>
            <textarea rows="5" placeholder="Write your feedback"></textarea>

            <button type="submit">Submit</button>
        </form>

    </div>

</body>

</html>
